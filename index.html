<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <script src="https://kit.fontawesome.com/553294db54.js" crossorigin="anonymous"></script>
    <link rel="stylesheet" href="./css/layout.css">
    <link rel="stylesheet" href="./css/components.css">
    <title>Panha's portfolio</title>
</head>
<body>
    
    <header id="navigation">
        <h2 id="brand">Personal Portfolio</h2>
        <nav id="navigator">
            <a href="#aboutMe">
                About
            </a>
            <a href="#techStack">
                Tech Stack
            </a>
            <a href="#project">
                Project
            </a>
            <a href="#experience">
                Experience
            </a>
            <a href="#education">
                Education
            </a>
            <a href="#contact">
                Contact
            </a>
        </nav>
    </header>
    <main id="mainSection">
        <section id="aboutMe">
            <div id="profile"></div>
            <p id="introduction">
                <span id="greeting">Hello! It's Panha</span>
                <span id="greeting">I am a software Developer.</span>
                I can help you with front-end, back-end, and full-stack development.
                Morover, I can also write Python script to help with automation.
            </p>
        </section>
        <section id="techStack">
            <p id="techIntro">Technology</p>
            <div id="techContainer">
                <div class="techCard" id="htmlCard">HTML</div>
                <div class="techCard" id="cssCard">CSS</div>
                <div class="techCard" id="jsCard">JS</div>
                <div class="techCard" id="pythonCard">Python</div>
            </div>
        </section>
        <section id="project">
            <div id="projectContainer">
                <p id="projectIntro">
                    Projects    
                </p>
                <div id="allProjects">
                    <div class="eachProject" id="weatherDisplay"></div>
                    <div class="eachProject" id="todoList"></div>
                    <div class="eachProject" id="digitalClock"></div>
                    <div class="eachProject" id="timer"></div>
                    <div class="eachProject" id="converter"></div>
                    <div class="eachProject" id="groceryCalculator"></div>
                    <div class="eachProject" id="calculator"></div>
                </div>
            </div>
        </section>
        <section id="experiences">

        </section>
        <section id="education">

        </section>
    </main>
    <footer id="footerSection">
        <section id="contact">

        </section>
    </footer>

    <script type="module" src="./js/main.js"></script>
</body>
</html>
